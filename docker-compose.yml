version: '3.8'

services:
  postgres:
    # Must ship pgvector: migration 20260714000000_enable_pgvector runs
    # CREATE EXTENSION vector, and `migrate deploy` runs before the app starts.
    image: pgvector/pgvector:pg16
    container_name: iscarb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iscarb_dev_password
      POSTGRES_DB: iscarb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - iscarb

  redis:
    image: redis:7-alpine
    container_name: iscarb-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - iscarb

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iscarb-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SKIP_ENV_VALIDATION=true
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:iscarb_dev_password@postgres:5432/iscarb
      - JWT_PRIVATE_KEY=dev-private-key-replace-in-production
      - JWT_PUBLIC_KEY=dev-public-key-replace-in-production
      - PASSWORD_RESET_SECRET=dev-only-reset-secret-min-32-chars-xx
      - CERTIFICATE_ID_SECRET=dev-only-cert-secret-16
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NVIDIA_API_KEY=dev-placeholder
      - LECTURE_STORAGE_BUCKET=iscarb-dev-bucket
      - LECTURE_STORAGE_REGION=me-central-1
      - LECTURE_STORAGE_ACCESS_KEY=dev
      - LECTURE_STORAGE_SECRET_KEY=dev
      - GIT_COMMIT_SHA=${GIT_COMMIT_SHA:-unknown}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
    networks:
      - iscarb

  # One-shot migration job (run explicitly, not at app boot):
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    profiles: ["migrate"]
    environment:
      - DATABASE_URL=postgresql://postgres:iscarb_dev_password@postgres:5432/iscarb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iscarb

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iscarb-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iscarb.edu
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - iscarb

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  iscarb:
    driver: bridge
