# RDF Triple Store (Apache Jena Fuseki) — Overlay for development
# Usage: docker compose -f docker-compose.yml -f docker-compose.fuseki.yml up -d

version: "3.8"

services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: iscarb-fuseki
    user: "root"
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-iscarb_dev}
      - JVM_ARGS=-Xmx2g -Xms512m
    volumes:
      - fuseki_data:/fuseki/databases
      - ./config/fuseki:/fuseki/configuration

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fuseki_data:

