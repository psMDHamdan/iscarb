<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="iSCARB">
  <!-- Composite icon: palm tree (green) + upward arrow (cyan->gold) + circuit (teal) + open book -->
  <g transform="translate(4,4)">
    <!-- open book base (teal) -->
    <path d="M4 42 Q4 38 8 38 L22 38 L22 46 L8 46 Q4 46 4 42 Z" fill="#0096C7" opacity="0.85"/>
    <path d="M24 38 L38 38 Q42 38 42 42 Q42 46 38 46 L24 46 Z" fill="#0096C7" opacity="0.7"/>
    <path d="M23 38 L23 46" stroke="#FFB700" stroke-width="1.4" stroke-linecap="round"/>
    <!-- palm trunk -->
    <path d="M22 38 L22 22" stroke="#1E8A5A" stroke-width="2.2" stroke-linecap="round"/>
    <!-- palm leaves (green) -->
    <path d="M22 22 Q12 16 6 20" stroke="#1E8A5A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M22 22 Q14 12 10 8" stroke="#1E8A5A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M22 20 Q22 9 20 4" stroke="#1E8A5A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M22 22 Q30 12 34 8" stroke="#1E8A5A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M22 22 Q32 16 38 20" stroke="#1E8A5A" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- upward arrow (cyan -> gold gradient) -->
    <defs>
      <linearGradient id="iscarbArrow" x1="22" y1="40" x2="46" y2="6" gradientUnits="userSpaceOnUse">
        <stop stop-color="#00B4D8"/>
        <stop offset="1" stop-color="#FFB700"/>
      </linearGradient>
    </defs>
    <path d="M26 36 L40 14 M40 14 L34 16 M40 14 L38 20" stroke="url(#iscarbArrow)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- circuit nodes -->
    <circle cx="8" cy="30" r="2" fill="#0096C7"/>
    <circle cx="40" cy="28" r="1.8" fill="#1E8A5A"/>
    <circle cx="44" cy="20" r="1.6" fill="#FFB700"/>
    <path d="M8 30 L14 30 L14 34" stroke="#0096C7" stroke-width="1.2" fill="none" opacity="0.6"/>
  </g>
  <!-- wordmark -->
  <text x="58" y="30" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">
    <tspan fill="#00B4D8">i</tspan><tspan fill="#1E8A5A">SCARB</tspan>
  </text>
  <!-- arabic tagline -->
  <text x="59" y="46" font-family="Cairo, Arial, sans-serif" font-weight="600" font-size="9.5" fill="#1E8A5A" letter-spacing="0.2">بنك المعرفة · تطوير المهارات · التميز في الأداء</text>
</svg>
